<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="440" viewBox="0 0 780 440" font-family="'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace">
  <!-- Each line is revealed by a clip rect widening left to right, so it types
       itself out. To edit content, change the <text> and leave the clip ids. -->
  <defs>
    <clipPath id="t1"><rect x="0" y="43"  width="0" height="24"><animate attributeName="width" from="0" to="780" begin="0.3s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="67"  width="0" height="24"><animate attributeName="width" from="0" to="780" begin="0.9s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="91"  width="0" height="24"><animate attributeName="width" from="0" to="780" begin="1.3s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="t4"><rect x="0" y="129" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="2.1s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t5"><rect x="0" y="153" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="2.7s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t6"><rect x="0" y="177" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="3.1s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t7"><rect x="0" y="201" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="3.5s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t8"><rect x="0" y="239" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="4.3s" dur="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="t9"><rect x="0" y="263" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="4.9s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t10"><rect x="0" y="287" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="5.3s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t11"><rect x="0" y="311" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="5.7s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t12"><rect x="0" y="335" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="6.1s" dur="0.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="t13"><rect x="0" y="373" width="0" height="24"><animate attributeName="width" from="0" to="780" begin="6.9s" dur="0.3s" fill="freeze"/></rect></clipPath>
    <clipPath id="tape"><rect x="1" y="409" width="778" height="30"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="779" height="439" rx="10" fill="#0d0b14" stroke="#aa42ff" stroke-opacity="0.35"/>

  <!-- title bar -->
  <circle cx="20" cy="17" r="5.5" fill="#ff5f56"/>
  <circle cx="38" cy="17" r="5.5" fill="#ffbd2e"/>
  <circle cx="56" cy="17" r="5.5" fill="#27c93f"/>
  <text x="390" y="21" text-anchor="middle" font-size="11" letter-spacing="2" fill="#aa42ff" fill-opacity="0.8">SKSM TERMINAL</text>
  <line x1="0" y1="32" x2="780" y2="32" stroke="#aa42ff" stroke-opacity="0.2"/>

  <g font-size="13.5">
    <!-- who -->
    <text x="22" y="60" clip-path="url(#t1)"><tspan fill="#aa42ff">SKSM@GH:~$</tspan><tspan fill="#efe9ff"> whoami</tspan></text>
    <text x="22" y="84" fill="#efe9ff" clip-path="url(#t2)">Saksham Arora · data science and quant research</text>
    <text x="22" y="108" fill="#c9c0e0" clip-path="url(#t3)">IIT Madras BS (Data Science) + GGSIPU B.Tech CSE, run in parallel</text>

    <!-- now -->
    <text x="22" y="146" clip-path="url(#t4)"><tspan fill="#aa42ff">SKSM@GH:~$</tspan><tspan fill="#efe9ff"> cat now.md</tspan></text>
    <text x="22" y="170" fill="#7a6ba3" clip-path="url(#t5)">studying</text>
    <text x="130" y="170" fill="#c9c0e0" clip-path="url(#t5)">statistics daily · quantitative finance · DSA</text>
    <text x="22" y="194" fill="#7a6ba3" clip-path="url(#t6)">working</text>
    <text x="130" y="194" fill="#c9c0e0" clip-path="url(#t6)">Cimplifie · ETL and automation pipelines, since Oct 2024</text>
    <text x="22" y="218" fill="#7a6ba3" clip-path="url(#t7)">writing</text>
    <text x="130" y="218" fill="#c9c0e0" clip-path="url(#t7)">chimera · blog.saksham.digital</text>

    <!-- recent -->
    <text x="22" y="256" clip-path="url(#t8)"><tspan fill="#aa42ff">SKSM@GH:~$</tspan><tspan fill="#efe9ff"> ls -t recent/</tspan></text>
    <text x="22" y="280" fill="#efe9ff" clip-path="url(#t9)">latch</text>
    <text x="170" y="280" fill="#c9c0e0" clip-path="url(#t9)">pins a lecture full screen, escape does nothing</text>
    <text x="22" y="304" fill="#efe9ff" clip-path="url(#t10)">lmex</text>
    <text x="170" y="304" fill="#c9c0e0" clip-path="url(#t10)">free-tier LLM APIs priced and traded on latency</text>
    <text x="22" y="328" fill="#efe9ff" clip-path="url(#t11)">backtest-audit</text>
    <text x="170" y="328" fill="#c9c0e0" clip-path="url(#t11)">PSR, deflated Sharpe and overfitting flags</text>
    <text x="22" y="352" fill="#efe9ff" clip-path="url(#t12)">git-vhs</text>
    <text x="170" y="352" fill="#c9c0e0" clip-path="url(#t12)">replay a file's whole git history, line by line</text>

    <text x="22" y="390" fill="#aa42ff" clip-path="url(#t13)">SKSM@GH:~$</text>
    <rect x="118" y="378" width="9" height="15" fill="#aa42ff" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1.1s" begin="7.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <line x1="0" y1="408" x2="780" y2="408" stroke="#aa42ff" stroke-opacity="0.2"/>
  <g clip-path="url(#tape)">
    <text y="429" font-size="12" fill="#aa42ff">
      <animateTransform attributeName="transform" type="translate" from="780 0" to="-1700 0" dur="24s" repeatCount="indefinite"/>
      llm-bench · latency benchmarker for LLM APIs, on PyPI&#160;&#160;·&#160;&#160;gitrade · a live market running inside a README&#160;&#160;·&#160;&#160;qrscholes · Black-Scholes pricer in 731 bytes&#160;&#160;·&#160;&#160;saksham.digital
    </text>
  </g>
</svg>
